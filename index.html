<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JR南武線 MONOPOLY 3D (PRO TOURNAMENT EDITION)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0f172a;
      color: #0f172a;
      overflow: hidden;
    }

    /* 南武線トリコロールライン */
    .nambu-stripes {
      display: flex;
      height: 4px;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
    }
    .stripe-yellow { flex: 2; background-color: #ffd400; }
    .stripe-orange { flex: 1; background-color: #ea580c; }
    .stripe-grape  { flex: 1; background-color: #4a1525; }

    /* ============================================================
       ホーム画面
       ============================================================ */
    #home-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #0f172a;
      z-index: 200;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
    }

    .home-card {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #ffd400;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 460px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: auto;
    }

    .home-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .station-sign-badge {
      background: #ffd400;
      color: #0f172a;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .home-title {
      font-size: 21px;
      font-weight: 900;
      color: #0f172a;
    }

    .home-sub {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .config-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-label {
      font-size: 12px;
      font-weight: 800;
      color: #334155;
    }

    .config-val {
      font-size: 12px;
      font-weight: 900;
      color: #ea580c;
    }

    .player-count-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .count-btn {
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 9px;
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      cursor: pointer;
    }

    .count-btn.active {
      background: #ffffff;
      border-color: #ffd400;
      color: #0f172a;
      box-shadow: 0 0 0 2px #ffd400;
    }

    .slider-range {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #e2e8f0;
      outline: none;
      -webkit-appearance: none;
      accent-color: #ffd400;
    }

    .player-roster {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }

    .p-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .type-toggle-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      color: #334155;
    }

    .type-toggle-btn.is-cpu {
      background: #ffd400;
      border-color: #eab308;
      color: #0f172a;
    }

    .btn-start-game {
      background: #ffd400;
      border: none;
      color: #0f172a;
      font-size: 15px;
      font-weight: 900;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.35);
    }

    /* ============================================================
       ゲーム画面レイアウト（全画面3D＋洗練されたフローティングUI）
       ============================================================ */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }

    .header-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      z-index: 30;
    }

    .game-logo {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-jn {
      background: #ffd400;
      color: #0f172a;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .logo-text {
      font-weight: 900;
      font-size: 13px;
      color: #ffffff;
    }

    .header-right {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 独占トラッカーHUD（画面上部中央） */
    .monopoly-tracker-bar {
      position: absolute;
      top: 50px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 25;
      overflow-x: auto;
    }

    .tracker-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      color: #ffffff;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tracker-pill.mono {
      box-shadow: 0 0 0 2px #ffd400;
    }

    /* 左側フローティング プレイヤーリスト（PC向け） */
    .players-floating-dock {
      position: absolute;
      top: 86px;
      left: 12px;
      width: 220px;
      max-height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
      pointer-events: auto;
      overflow-y: auto;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
    }

    .player-card.active-turn {
      border-color: #ffd400;
      background: #ffffff;
      box-shadow: 0 0 0 2px #ffd400;
    }

    .player-card.bankrupted {
      opacity: 0.35;
      background: #e2e8f0;
    }

    .p-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .p-name-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 900;
    }

    .p-tag {
      font-size: 8px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      background: #e2e8f0;
      color: #475569;
    }

    .p-status-jail {
      font-size: 8px;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 3px;
      background: #ea580c;
      color: #ffffff;
    }

    .p-status-pass {
      font-size: 8px;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 3px;
      background: #0284c7;
      color: #ffffff;
    }

    .p-money {
      font-size: 15px;
      font-weight: 900;
      color: #0f172a;
    }

    .p-props-list {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-top: 2px;
      max-height: 38px;
      overflow-y: auto;
    }

    .prop-chip {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
    }

    .prop-chip.mortgaged {
      background: #94a3b8 !important;
      text-decoration: line-through;
    }

    /* 右下フローティング 操作ドック（適正サイズで盤面を邪魔しない） */
    .action-floating-dock {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 240px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e2e8f0;
      border-top: 3px solid #ffd400;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 20;
      pointer-events: auto;
    }

    .turn-indicator {
      font-size: 11px;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dice-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dice-cube {
      width: 36px;
      height: 36px;
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #0f172a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
    }

    .dice-cube.rolling {
      animation: diceShake 0.1s infinite;
      border-color: #ffd400;
      background: #fffbeb;
    }

    @keyframes diceShake {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(8deg) scale(1.08); }
      100% { transform: rotate(-8deg) scale(1); }
    }

    .action-buttons-group {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .btn-roll {
      grid-column: span 2;
      background: #ffd400;
      color: #0f172a;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(234, 179, 8, 0.35);
    }

    .btn-roll:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-action-sub {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-size: 10px;
      font-weight: 800;
      padding: 5px;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
    }

    .btn-action-sub:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      border-color: #e2e8f0;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* 浮動マネー・エフェクト */
    #floating-money-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .floating-money {
      position: absolute;
      font-size: 28px;
      font-weight: 900;
      animation: floatUp 1.4s ease-out forwards;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .floating-money.gain { color: #22c55e; }
    .floating-money.loss { color: #ef4444; }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(20px) scale(0.7); }
      20% { opacity: 1; transform: translateY(0) scale(1.15); }
      80% { opacity: 1; transform: translateY(-40px) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.9); }
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }

    /* 駅名標ポップアップカットイン */
    #station-cutin {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px) scale(0.9);
      background: #ffffff;
      color: #0f172a;
      border: 3px solid #ffd400;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      min-width: 260px;
      max-width: 90%;
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    #station-cutin.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .cutin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ffd400;
      padding-bottom: 2px;
    }

    .cutin-name-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .cutin-code {
      background: #ffd400;
      color: #0f172a;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .cutin-name {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
    }

    .cutin-meta {
      font-size: 11px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      color: #334155;
    }

    #event-toast {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    #event-toast.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    /* モーダル群 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 250;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      overflow-y: auto;
      padding: 16px 10px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      margin: auto;
    }

    .modal-bar {
      height: 6px;
      border-radius: 3px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 4px;
      text-align: center;
    }

    .modal-desc {
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 14px;
      white-space: pre-line;
      text-align: left;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .btn-confirm { background: #ffd400; color: #0f172a; }
    .btn-cancel  { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    /* 資産管理マネージャー */
    .manager-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .manager-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #f8fafc;
      font-size: 11px;
    }

    .manager-actions {
      display: flex;
      gap: 4px;
    }

    .btn-mgr-mini {
      padding: 3px 6px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
    }

    /* 競売（オークション）スタイル */
    .auction-bid-board {
      background: #fffbeb;
      border: 2px solid #fde047;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }

    .auction-price {
      font-size: 26px;
      font-weight: 900;
      color: #ea580c;
    }

    .auction-bidder {
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
    }

    .auction-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .btn-bid {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-pass {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #dc2626;
      font-weight: 900;
    }

    /* 権利書カード */
    .deed-card {
      border: 2px solid #0f172a;
      border-radius: 8px;
      padding: 10px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
    }
    .deed-header {
      padding: 6px;
      color: #ffffff;
      font-weight: 900;
      font-size: 14px;
      text-align: center;
      border-radius: 4px;
    }
    .deed-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #e2e8f0;
      padding: 2px 0;
    }

    /* ============================================================
       スマホ・縦画面レイアウト（上部60%盤面・下部40%ドック）
       ============================================================ */
    @media (max-width: 768px) {
      .app-container {
        display: flex;
        flex-direction: column;
      }
      #webgl-container {
        position: relative;
        width: 100%;
        height: 60dvh;
        flex-shrink: 0;
      }
      .players-floating-dock {
        position: relative;
        top: auto;
        left: auto;
        width: 100%;
        max-height: none;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px 8px;
        background: #0f172a;
      }
      .action-floating-dock {
        position: relative;
        bottom: auto;
        right: auto;
        width: 100%;
        border-radius: 0;
        box-shadow: none;
        padding: 8px;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="nambu-stripes">
  <div class="stripe-yellow"></div>
  <div class="stripe-orange"></div>
  <div class="stripe-grape"></div>
</div>

<!-- ==========================================
     ホーム画面
     ========================================== -->
<div id="home-screen">
  <div class="home-card">
    <div class="home-header">
      <span class="station-sign-badge">JR NAMBU LINE</span>
      <h1 class="home-title">南武線 MONOPOLY 3D</h1>
      <p class="home-sub">全30駅 完全収録 プロフェッショナル仕様</p>
    </div>

    <div class="config-group">
      <div class="config-label-row">
        <label class="config-label">参加人数</label>
      </div>
      <div class="player-count-selector">

    );

  function getSquarePos3D(id) {
    let x = 0, z = 0;
    if (id === 0) {
      x = HALF_SIZE - CW / 2; z = HALF_SIZE - CW / 2;
    } else if (id < 10) {
      x = HALF_SIZE - CW - (id - 0.5) * SW; z = HALF_SIZE - CW / 2;
    } else if (id === 10) {
      x = -(HALF_SIZE - CW / 2); z = HALF_SIZE - CW / 2;
    } else if (id < 20) {
      x = -(HALF_SIZE - CW / 2); z = HALF_SIZE - CW - ((id - 10) - 0.5) * SW;
    } else if (id === 20) {
      x = -(HALF_SIZE - CW / 2); z = -(HALF_SIZE - CW / 2);
    } else if (id < 30) {
      x = -(HALF_SIZE - CW) + ((id - 20) - 0.5) * SW; z = -(HALF_SIZE - CW / 2);
    } else if (id === 30) {
      x = HALF_SIZE - CW / 2; z = -(HALF_SIZE - CW / 2);
    } else {
      x = HALF_SIZE - CW / 2; z = -(HALF_SIZE - CW) + ((id - 30) - 0.5) * SW;
    }
    return new THREE.Vector3(x, 0.05, z);
  }

  function createHighlightBox() {
    const geo = new THREE.BoxGeometry(SW, 0.15, CW);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffd400, wireframe: true });
    tileHighlightMesh = new THREE.Mesh(geo, mat);
    tileHighlightMesh.visible = false;
    scene.add(tileHighlightMesh);
  }

  function highlightTile(sqId) {
    const sq = SQUARES[sqId];
    const pos = getSquarePos3D(sqId);
    const isCorner = (sqId % 10 === 0);

    const w = isCorner ? CW : SW;
    const d = isCorner ? CW : CW;

    tileHighlightMesh.geometry.dispose();
    tileHighlightMesh.geometry = new THREE.BoxGeometry(w + 0.06, 0.22, d + 0.06);

    let rotY = 0;
    if (sqId === 0 || sqId < 10) rotY = 0;
    else if (sqId <= 20) rotY = Math.PI / 2;
    else if (sqId <= 30) rotY = Math.PI;
    else rotY = -Math.PI / 2;

    tileHighlightMesh.rotation.y = rotY;
    tileHighlightMesh.position.set(pos.x, 0.06, pos.z);
    tileHighlightMesh.visible = true;

    showStationCutin(sq);
  }

  function createGridTiles() {
    tileMeshes.length = 0;
    for (let i = 0; i < 40; i++) {
      const sq = SQUARES[i];
      const isCorner = (i % 10 === 0);

      const width = isCorner ? CW - 0.04 : SW - 0.04;
      const depth = CW - 0.04;

      const texture = createTileTexture(sq, isCorner);
      const geo = new THREE.BoxGeometry(width, 0.1, depth);
      const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15 });

      const tileMesh = new THREE.Mesh(geo, mat);
      const pos = getSquarePos3D(i);
      tileMesh.position.set(pos.x, 0, pos.z);
      tileMesh.receiveShadow = true;
      tileMesh.userData = { squareId: i };

      if (i === 0 || i < 10) tileMesh.rotation.y = 0;
      else if (i <= 20) tileMesh.rotation.y = Math.PI / 2;
      else if (i <= 30) tileMesh.rotation.y = Math.PI;
      else tileMesh.rotation.y = -Math.PI / 2;

      const plateGeo = new THREE.PlaneGeometry(width * 0.95, 0.18);
      const plateMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
      const plateMesh = new THREE.Mesh(plateGeo, plateMat);
      plateMesh.rotation.x = -Math.PI / 2;
      plateMesh.position.set(0, 0.052, depth * 0.38);
      plateMesh.name = `owner-plate-${i}`;
      tileMesh.add(plateMesh);

      scene.add(tileMesh);
      tileMeshes.push(tileMesh);
    }
  }

  function updateTileOwnershipVisual(sqId, color) {
    const tile = tileMeshes[sqId];
    if (!tile) return;
    const plate = tile.getObjectByName(`owner-plate-${sqId}`);
    if (plate) {
      if (color) {
        plate.material.color.set(color);
        plate.material.opacity = 0.95;
      } else {
        plate.material.opacity = 0;
      }
    }
  }

  function createTileTexture(sq, isCorner) {
    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = isCorner ? 512 : 920;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 14;
    ctx.strokeRect(0, 0, canvas.width, canvas.height);

    if (isCorner) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (sq.type === "go") {
        ctx.fillStyle = "#ffd400";
        ctx.fillRect(0, 0, 512, 150);
        ctx.fillStyle = "#0f172a";
        ctx.font = "900 96px sans-serif";
        ctx.fillText("川崎", 256, 84);

        ctx.fillStyle = "#0f172a";
        ctx.font = "900 104px sans-serif";
        ctx.fillText("START", 256, 250);
        ctx.font = "bold 44px sans-serif";
        ctx.fillStyle = "#ea580c";
        ctx.fillText("給料 $200 獲得", 256, 370);
      } else if (sq.type === "jail") {
        ctx.fillStyle = "#475569";
        ctx.font = "900 72px sans-serif";
        ctx.fillText("中原電車区", 256, 170);
        ctx.font = "bold 48px sans-serif";
        ctx.fillStyle = "#ea580c";
        ctx.fillText("留置線", 256, 280);
        ctx.font = "40px sans-serif";
        ctx.fillStyle = "#64748b";
        ctx.fillText("(見学中)", 256, 380);
      } else if (sq.type === "parking") {
        ctx.fillStyle = "#16a34a";
        ctx.font = "900 72px sans-serif";
        ctx.fillText("多摩川緑地", 256, 180);
        ctx.font = "bold 44px sans-serif";
        ctx.fillStyle = "#64748b";
        ctx.fillText("河川敷休憩所", 256, 300);
      } else if (sq.type === "gotojail") {
        ctx.fillStyle = "#dc2626";
        ctx.font = "900 72px sans-serif";
        ctx.fillText("車庫へ回送", 256, 180);
        ctx.font = "bold 44px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("電車区へ行け", 256, 300);
      }
    } else {
      if (sq.color) {
        ctx.fillStyle = sq.color;
        ctx.fillRect(0, 0, 512, 150);
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, 512, 150);
      }

      if (sq.code) {
        ctx.fillStyle = "#ffd400";
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.roundRect(176, 180, 160, 100, 16);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.font = "900 38px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("JN", 256, 220);
        ctx.font = "900 42px sans-serif";
        ctx.fillText(sq.code.replace("JN ", ""), 256, 262);
      }

      ctx.fillStyle = "#0f172a";
      ctx.font = "900 68px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(sq.name, 256, 370);

      if (sq.roma) {
        ctx.font = "bold 34px sans-serif";
        ctx.fillStyle = "#64748b";
        ctx.fillText(sq.roma, 256, 436);
      }

      if (sq.price) {
        ctx.font = "900 64px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText(`$${sq.price}`, 256, 770);
        ctx.font = "bold 44px sans-serif";
        ctx.fillStyle = "#64748b";
        ctx.fillText(`運賃 $${sq.rent ? sq.rent[0] : 25}`, 256, 840);
      } else if (sq.sub) {
        ctx.font = "bold 48px sans-serif";
        ctx.fillStyle = "#ea580c";
        ctx.fillText(sq.sub, 256, 800);
      }
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    return tex;
  }

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.38, 0.18, 24), mat);

      base.castShadow = true;

      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 0.5, 24), mat);
      body.position.y = 0.4;

      g.add(head);

  function positionToken(p, sqId) {
    const pos = getSquarePos3D(sqId);
    const offsets = [
      { x: -0.28, z: -0.28 },
      { x: 0.28,  z: -0.28 },
      { x: -0.28, z: 0.28 },
      { x: 0.28,  z: 0.28 }
    ];
    const off = offsets[(p.id - 1) % 4];
    p.mesh.position.set(pos.x + off.x, 0.05, pos.z + off.z);
  }

  function onBoardClick(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(tileMeshes);
    if (intersects.length > 0) {
      const sqId = intersects[0].object.userData.squareId;
      if (sqId !== undefined) {
        showStationDetails(sqId);
      }
    }
  }

  let confettiCtx, confettiParticles = [];
  function initConfetti() {
    const canvas = document.getElementById("confetti-canvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    confettiCtx = canvas.getContext("2d");
  }

  function triggerConfetti() {
    if (gameSpeed === 999) return;
    const colors = ["#ffd400", "#ea580c", "#4a1525", "#ffffff", "#0284c7"];
    for (let i = 0; i < 70; i++) {
      confettiParticles.push({
        x: window.innerWidth / 2,
        y: window.innerHeight * 0.35,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.8) * 14,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        vr: Math.random() * 10 - 5,
        life: 1.0
      });
    }
  }

  function updateConfetti() {
    if (confettiParticles.length === 0) return;
    confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (let i = confettiParticles.length - 1; i >= 0; i--) {
      const p = confettiParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.rotation += p.vr;
      p.life -= 0.015;

      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate((p.rotation * Math.PI) / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.globalAlpha = Math.max(0, p.life);
      confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
      confettiCtx.restore();

      if (p.life <= 0) {
        confettiParticles.splice(i, 1);
      }
    }
  }

  /* ============================================================
     ゲーム進行ロジック

  function rollDice() {
    if (isGameOver || isMoving) return;

    const p = players[currentTurn];
    if (p.bankrupt) {
      nextTurn();
      return;
    }

    const rollBtn = document.getElementById("roll-btn");
    rollBtn.disabled = true;

    const cube1 = document.getElementById("dice-1");
    const cube2 = document.getElementById("dice-2");
    cube1.classList.add("rolling");
    cube2.classList.add("rolling");

    const d1 = Math.floor(Math.random() * 6) + 1;
    const d2 = Math.floor(Math.random() * 6) + 1;
    const isDouble = (d1 === d2);
    lastDiceRoll = [d1, d2];

    const rollDuration = (gameSpeed === 999) ? 0 : 300 / gameSpeed;

    setTimeout(() => {
      cube1.classList.remove("rolling");
      cube2.classList.remove("rolling");
      cube1.innerText = d1;
      cube2.innerText = d2;
      handlePostRoll(p, d1, d2, isDouble);
    }, rollDuration);
  }

  function handlePostRoll(p, d1, d2, isDouble) {
    if (p.inJail) {
      if (isDouble) {
        p.inJail = false;
        p.jailTurns = 0;
        doublesCount = 0;
        showEventToast(`${p.name} ゾロ目出所！`);
        startMove(p, d1 + d2, false);
      } else {
        p.jailTurns++;
        if (p.jailTurns >= 3) {
          p.money -= 50;
          p.inJail = false;
          p.jailTurns = 0;
          spawnMoneyFloat(-50);
          showEventToast(`保釈金 $50 出所`);
          checkBankruptcy(p, null);
          startMove(p, d1 + d2, false);
        } else {
          showEventToast(`出所失敗 (${p.jailTurns}/3 ターン目)`);
          finishTurn(false);
        }
      }
      return;
    }

    if (isDouble) {
      doublesCount++;
      if (doublesCount >= 3) {
        showEventToast(`3連続ゾロ目！緊急回送`);
        doublesCount = 0;
        sendToJail(p);
        finishTurn(false);
        return;
      }
      showEventToast(`ゾロ目！もう一度`);
    } else {
      doublesCount = 0;
    }

    startMove(p, d1 + d2, isDouble);
  }

  function startMove(p, steps, isDouble) {
    isMoving = true;
    updateUI(); // 移動中はボタンをロック

    const oldPos = p.pos;
    let newPos = (oldPos + steps) % 40;
    if (newPos < 0) newPos += 40;
    const passedGo = steps > 0 && ((oldPos + steps) >= 40);

    if (gameSpeed === 999) {
      p.pos = newPos;
      positionToken(p, newPos);
      isMoving = false;
      highlightTile(newPos);
      handleSquareArrival(p, newPos, steps, passedGo, isDouble);
      return;
    }

    let stepCount = 0;
    const absSteps = Math.abs(steps);
    const stepDir = steps >= 0 ? 1 : -1;
    const hopDuration = 100 / gameSpeed;

    const offsets = [
      { x: -0.28, z: -0.28 },
      { x: 0.28,  z: -0.28 },
      { x: -0.28, z: 0.28 },
      { x: 0.28,  z: 0.28 }
    ];
    const off = offsets[(p.id - 1) % 4];

    function hop() {
      if (stepCount >= absSteps) {
        p.pos = newPos;
        isMoving = false;
        highlightTile(newPos);
        handleSquareArrival(p, newPos, steps, passedGo, isDouble);
        return;
      }

      stepCount++;
      let nextId = (oldPos + stepCount * stepDir) % 40;
      if (nextId < 0) nextId += 40;

      const targetPos = getSquarePos3D(nextId);
      const startPos = p.mesh.position.clone();
      const endPos = new THREE.Vector3(targetPos.x + off.x, 0.05, targetPos.z + off.z);

      const startTime = performance.now();

      function animHop(now) {
        const progress = Math.min((now - startTime) / hopDuration, 1.0);
        p.mesh.position.lerpVectors(startPos, endPos, progress);
        p.mesh.position.y = 0.05 + Math.sin(progress * Math.PI) * 0.45;

        if (progress < 1.0) {
          requestAnimationFrame(animHop);
        } else {
          p.mesh.position.copy(endPos);
          hop();
        }
      }
      requestAnimationFrame(animHop);
    }
    hop();
  }

  function handleSquareArrival(p, pos, steps, passedGo, isDouble) {
    const sq = SQUARES[pos];

    if (passedGo && sq.type !== "gotojail") {
      p.money += 200;
      spawnMoneyFloat(200);
      showEventToast(`川崎通過 給料 +$200`);
    }

    updateUI();

    if (sq.type === "go") {
      finishTurn(isDouble);
    } else if (sq.type === "tax") {
      p.money -= sq.amount;
      spawnMoneyFloat(-sq.amount);
      showEventToast(`税金納付 -$${sq.amount}`);
      if (checkBankruptcy(p, null)) return;
      finishTurn(isDouble);
    } else if (sq.type === "gotojail") {
      showEventToast(`車庫へ回送！中原電車区へ`);
      sendToJail(p);
      finishTurn(false);
    } else if (sq.type === "chance") {
      drawCard(p, CHANCE_CARDS, "快速運行", isDouble);
    } else if (sq.type === "chest") {
      drawCard(p, CHEST_CARDS, "南武線カード", isDouble);
    } else if (sq.type === "parking" || sq.type === "jail") {
      finishTurn(isDouble);
    } else if (sq.price) {
      handlePropertyLanding(p, sq, isDouble);
    }
  }

  function handlePropertyLanding(p, sq, isDouble) {
    if (sq.owner === null) {
      if (p.money >= sq.price) {
        if (p.isCPU) {
          handleCpuDecision(p, sq, "buy", isDouble);
        } else {
          showModal(
            `${sq.name}駅 (${sq.code})`,
            sq.color,
            `価格: $${sq.price} / 基本運賃: $${sq.rent ? sq.rent[0] : 25}\n\n空き駅です。この駅の所有権を購入しますか？\n（見送った場合、銀行による公開競売が開始されます）`,
            `購入 ($${sq.price})`,
            "見送る (競売へ)",
            (confirm) => {
              if (confirm) {
                p.money -= sq.price;
                sq.owner = p.id;
                p.props.push(sq);
                spawnMoneyFloat(-sq.price);
                triggerConfetti();
                updateTileOwnershipVisual(sq.id, p.color);
                showEventToast(`${sq.name}駅 を買収！`);
                renderMonopolyTracker();

                if (checkMonopoly(p.id, sq.group)) {
                  showEventToast(`【${sq.group.toUpperCase()} 独占達成！】運賃2倍`);
                  triggerConfetti();
                }
                finishTurn(isDouble);
              } else {
                startAuction(sq, isDouble);
              }
            }
          );
        }
      } else {
        showEventToast(`購入資金不足のため競売開始`);
        startAuction(sq, isDouble);
      }
    } else if (sq.owner === p.id) {
      showEventToast(`自社所有の駅に到着`);
      finishTurn(isDouble);
    } else {
      const owner = players.find(pl => pl.id === sq.owner);
      if (sq.mortgaged) {
        showEventToast(`抵当中のため運賃免除`);
      } else {
        const rent = calculateRent(sq, lastDiceRoll[0] + lastDiceRoll[1]);
        p.money -= rent;
        owner.money += rent;
        spawnMoneyFloat(-rent);
        showEventToast(`${owner.name} へ運賃 $${rent} 支払い`);
        if (checkBankruptcy(p, owner)) return;
      }
      finishTurn(isDouble);
    }
  }

  /* ============================================================
     競売（オークション）
     ============================================================ */
  function startAuction(sq, isDouble) {
    currentAuction = {
      sq: sq,
      isDouble: isDouble,
      highestBid: 10,
      highestBidder: null,
      activeBidders: players.filter(p => !p.bankrupt),
      currentBidderIndex: 0
    };

    document.getElementById("auction-prop-name").innerText = `${sq.name}駅 (${sq.code}) - 定価 $${sq.price}`;
    document.getElementById("auction-current-price").innerText = `$${currentAuction.highestBid}`;
    document.getElementById("auction-current-bidder").innerText = `最高入札者: なし`;
    document.getElementById("auction-modal").classList.add("active");

    processAuctionTurn();
  }

  function processAuctionTurn() {
    if (currentAuction.activeBidders.length <= 1 && currentAuction.highestBidder) {
      concludeAuction();
      return;
    }
    if (currentAuction.activeBidders.length === 0) {
      closeAuctionModal();
      showEventToast(`競売不成立：銀行預かり`);
      finishTurn(currentAuction.isDouble);
      return;
    }

    const bidder = currentAuction.activeBidders[currentAuction.currentBidderIndex];
    if (bidder.isCPU) {
      handleCpuAuctionTurn(bidder);
    } else {
      document.getElementById("auction-controls").style.display = "grid";
    }
  }

  function placeAuctionBid(increment) {
    const me = currentAuction.activeBidders[currentAuction.currentBidderIndex];
    const newBid = currentAuction.highestBid + increment;

    if (newBid > me.money) {
      alert("所持金を超える入札はできません。");
      return;
    }

    currentAuction.highestBid = newBid;
    currentAuction.highestBidder = me;

    document.getElementById("auction-current-price").innerText = `$${newBid}`;
    document.getElementById("auction-current-bidder").innerText = `最高入札者: ${me.name}`;
    advanceAuctionBidder();
  }

  function passAuctionBid() {
    currentAuction.activeBidders.splice(currentAuction.currentBidderIndex, 1);
    if (currentAuction.currentBidderIndex >= currentAuction.activeBidders.length) {
      currentAuction.currentBidderIndex = 0;
    }
    processAuctionTurn();
  }

  function advanceAuctionBidder() {
    currentAuction.currentBidderIndex = (currentAuction.currentBidderIndex + 1) % currentAuction.activeBidders.length;
    processAuctionTurn();
  }

  function handleCpuAuctionTurn(cpu) {
    document.getElementById("auction-controls").style.display = "none";
    const sq = currentAuction.sq;
    const iq = aiLevel / 100;

    setTimeout(() => {
      let maxVal = sq.price * (0.6 + iq * 0.7);
      if (COLOR_GROUPS[sq.group]?.some(id => SQUARES[id].owner === cpu.id)) {
        maxVal *= 1.8;
      }

      const nextBid = currentAuction.highestBid + 10;
      if (nextBid <= maxVal && nextBid <= cpu.money - 50) {
        currentAuction.highestBid = nextBid;
        currentAuction.highestBidder = cpu;
        document.getElementById("auction-current-price").innerText = `$${nextBid}`;
        document.getElementById("auction-current-bidder").innerText = `最高入札者: ${cpu.name}`;
        advanceAuctionBidder();
      } else {
        passAuctionBid();
      }
    }, 450 / gameSpeed);
  }

  function concludeAuction() {
    const winner = currentAuction.highestBidder;
    const sq = currentAuction.sq;
    const price = currentAuction.highestBid;

    winner.money -= price;
    sq.owner = winner.id;
    winner.props.push(sq);
    updateTileOwnershipVisual(sq.id, winner.color);
    renderMonopolyTracker();
    updateUI();

    closeAuctionModal();
    showEventToast(`競売落札！${winner.name} が $${price} で獲得`);
    triggerConfetti();

    if (checkMonopoly(winner.id, sq.group)) {
      showEventToast(`【${sq.group.toUpperCase()} 独占達成！】運賃2倍`);
    }

    finishTurn(currentAuction.isDouble);
  }

  function closeAuctionModal() {
    document.getElementById("auction-modal").classList.remove("active");
    currentAuction = null;
  }

  /* ============================================================
     資産管理マネージャー
     ============================================================ */
  function openManagerModal() {
    if (players[currentTurn].isCPU || isMoving || isGameOver) return;

    const p = players[currentTurn];
    const list = document.getElementById("manager-property-list");
    list.innerHTML = "";

    if (p.props.length === 0) {
      list.innerHTML = `<p style="font-size:11px; color:#94a3b8; text-align:center; padding:12px;">所有している駅がありません。</p>`;
    } else {
      p.props.forEach(sq => {
        const isMono = checkMonopoly(p.id, sq.group);
        const canBuild = sq.type === "prop" && isMono && canBuildHouse(sq) && p.money >= sq.houseCost;
        const canSell = sq.houses > 0;
        const canMortgage = !sq.mortgaged && sq.houses === 0;
        const canUnmortgage = sq.mortgaged && p.money >= Math.floor(sq.price * 0.55);

        const row = document.createElement("div");
        row.className = "manager-row";
        row.innerHTML = `
          <div>
            <span class="prop-chip" style="background:${sq.color || '#475569'};">${sq.name}</span>
            <span style="font-weight:800; font-size:10px;">${sq.mortgaged ? '【抵当中】' : (sq.houses === 5 ? '★駅ビル' : (sq.houses > 0 ? `+${sq.houses}棟` : '更地'))}</span>
          </div>
          <div class="manager-actions">
            ${canBuild ? `<button class="btn-mgr-mini" onclick="buildHouseManager(${sq.id})">+増築 ($${sq.houseCost})</button>` : ''}
            ${canSell ? `<button class="btn-mgr-mini" onclick="sellHouseManager(${sq.id})">-売却 (+$${sq.houseCost/2})</button>` : ''}
            ${canMortgage ? `<button class="btn-mgr-mini" onclick="mortgagePropManager(${sq.id})">抵当 (+$${sq.price/2})</button>` : ''}
            ${canUnmortgage ? `<button class="btn-mgr-mini" onclick="unmortgagePropManager(${sq.id})">解除 (-$${Math.floor(sq.price*0.55)})</button>` : ''}
          </div>
        `;
        list.appendChild(row);
      });
    }

    document.getElementById("manager-modal").classList.add("active");
  }

  function closeManagerModal() {
    document.getElementById("manager-modal").classList.remove("active");
  }

  function buildHouseManager(sqId) {
    const p = players[currentTurn];
    const sq = SQUARES[sqId];
    p.money -= sq.houseCost;
    sq.houses++;
    spawn3DBuilding(sq.id, p.color, sq.houses);
    spawnMoneyFloat(-sq.houseCost);
    updateUI();
    openManagerModal();
  }

  function sellHouseManager(sqId) {
    const p = players[currentTurn];
    const sq = SQUARES[sqId];
    sq.houses--;
    p.money += Math.floor(sq.houseCost / 2);
    spawnMoneyFloat(Math.floor(sq.houseCost / 2));
    updateUI();
    openManagerModal();
  }

  function mortgagePropManager(sqId) {
    const p = players[currentTurn];
    const sq = SQUARES[sqId];
    sq.mortgaged = true;
    p.money += Math.floor(sq.price / 2);
    spawnMoneyFloat(Math.floor(sq.price / 2));
    updateUI();
    openManagerModal();
  }

  function unmortgagePropManager(sqId) {
    const p = players[currentTurn];
    const sq = SQUARES[sqId];
    const cost = Math.floor(sq.price * 0.55);
    p.money -= cost;
    sq.mortgaged = false;
    spawnMoneyFloat(-cost);
    updateUI();
    openManagerModal();
  }

  /* ============================================================
     独占状況トラッカーHUD
     ============================================================ */
  function renderMonopolyTracker() {
    const bar = document.getElementById("monopoly-tracker-bar");
    bar.innerHTML = "";

    const groupNames = {
      brown: "尻手/矢向", lightblue: "鹿島田/平間/向河原", pink: "小杉/中原/新城",
      orange: "溝口/津田山/久地", red: "宿河原/登戸/中野島", yellow: "稲田堤/矢野口/長沼",
      green: "南多摩/本町/分倍河原", darkblue: "西国立/立川", rr: "南武支線", util: "変電所"
    };

    for (const key in COLOR_GROUPS) {
      const ids = COLOR_GROUPS[key];
      const sqs = ids.map(id => SQUARES[id]);
      const ownerCounts = {};
      sqs.forEach(s => {
        if (s.owner !== null) ownerCounts[s.owner] = (ownerCounts[s.owner] || 0) + 1;
      });

      let status = "-";
      let isMono = false;
      for (const oId in ownerCounts) {
        if (ownerCounts[oId] === ids.length) {
          status = `P${oId}独占`;
          isMono = true;
        } else {
          status = `P${oId}:${ownerCounts[oId]}/${ids.length}`;
        }
      }

      const pill = document.createElement("div");
      pill.className = `tracker-pill ${isMono ? 'mono' : ''}`;
      pill.style.background = sqs[0].color || '#334155';
      pill.innerText = `${groupNames[key]} [${status}]`;
      bar.appendChild(pill);
    }
  }

  function calculateRent(sq, diceSum) {
    if (sq.type === "railroad") {
      const owned = COLOR_GROUPS.rr.filter(id => SQUARES[id].owner === sq.owner && !SQUARES[id].mortgaged).length;
      return [0, 25, 50, 100, 200][owned] || 25;
    }
    if (sq.type === "utility") {
      const owned = COLOR_GROUPS.util.filter(id => SQUARES[id].owner === sq.owner && !SQUARES[id].mortgaged).length;
      return (owned === 2) ? diceSum * 10 : diceSum * 4;
    }
    if (sq.type === "prop") {
      if (sq.houses === 0) {
        const isMono = checkMonopoly(sq.owner, sq.group);
        return isMono ? sq.rent[0] * 2 : sq.rent[0];
      }
      return sq.rent[sq.houses] || sq.rent[0];
    }
    return 0;
  }

  function checkMonopoly(playerId, groupKey) {
    const ids = COLOR_GROUPS[groupKey];
    if (!ids) return false;
    return ids.every(id => SQUARES[id].owner === playerId);
  }

  function canBuildHouse(sq) {
    if (sq.houses >= 5) return false;
    const groupSquares = COLOR_GROUPS[sq.group].map(id => SQUARES[id]);
    const minHouses = Math.min(...groupSquares.map(s => s.houses));
    return (sq.houses === minHouses);
  }

  function handleCpuDecision(cpu, sq, mode, isDouble) {
    setTimeout(() => {
      let willAct = false;
      const iq = aiLevel / 100;

      if (mode === "buy") {
        const minReserve = 200 * (1.0 - iq * 0.5);
        const hasOthers = COLOR_GROUPS[sq.group]?.some(id => SQUARES[id].owner === cpu.id);
        if (iq > 0.6) {
          if ((cpu.money - sq.price >= minReserve) || (hasOthers && cpu.money >= sq.price)) {
            willAct = true;
          }
        } else {
          if (cpu.money >= sq.price && Math.random() < (0.5 + iq * 0.5)) {
            willAct = true;
          }
        }
      }

      if (willAct) {
        cpu.money -= sq.price;
        sq.owner = cpu.id;
        cpu.props.push(sq);
        spawnMoneyFloat(-sq.price);
        updateTileOwnershipVisual(sq.id, cpu.color);
        showEventToast(`[CPU] ${sq.name}駅 を買収`);
        renderMonopolyTracker();
        if (checkMonopoly(cpu.id, sq.group)) {
          showEventToast(`[CPU] 【${sq.group.toUpperCase()} 独占達成！】`);
          triggerConfetti();
        }
        finishTurn(isDouble);
      } else {
        startAuction(sq, isDouble);
      }
    }, 500 / gameSpeed);
  }

  /* ============================================================
     交渉（トレード）ロジック
     ============================================================ */
  function openTradeModal() {
    // CPU手番中や移動中、破産中は完全に弾く
    if (players[currentTurn].isCPU || isMoving || isGameOver) return;

    const p = players[currentTurn];
    const select = document.getElementById("trade-target-select");
    select.innerHTML = "";

    const targets = players.filter(pl => pl.id !== p.id && !pl.bankrupt);
    if (targets.length === 0) {
      alert("交渉可能な相手がいません。");
      return;
    }

    targets.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.innerText = `${t.name} (資金 $${t.money} / 駅 ${t.props.length}件)`;
      select.appendChild(opt);
    });

    renderTradeItems();
    document.getElementById("trade-modal").classList.add("active");
  }

  function closeTradeModal() {
    document.getElementById("trade-modal").classList.remove("active");
  }

  function renderTradeItems() {
    const me = players[currentTurn];
    const targetId = parseInt(document.getElementById("trade-target-select").value, 10);
    const target = players.find(pl => pl.id === targetId);

    const myList = document.getElementById("my-trade-props");
    const targetList = document.getElementById("target-trade-props");
    myList.innerHTML = "";
    targetList.innerHTML = "";

    me.props.forEach(sq => {
      const label = document.createElement("label");
      label.style.display = "flex"; label.style.gap = "4px";
      label.innerHTML = `<input type="checkbox" value="${sq.id}" class="my-prop-check" onchange="updateTradeDialogue()"> ${sq.name} ($${sq.price})`;
      myList.appendChild(label);
    });
    if (me.props.length === 0) myList.innerHTML = `<span style="font-size:10px; color:#94a3b8;">所有駅なし</span>`;

    if (target) {
      target.props.forEach(sq => {
        const label = document.createElement("label");
        label.style.display = "flex"; label.style.gap = "4px";
        label.innerHTML = `<input type="checkbox" value="${sq.id}" class="target-prop-check" onchange="updateTradeDialogue()"> ${sq.name} ($${sq.price})`;
        targetList.appendChild(label);
      });
      if (target.props.length === 0) targetList.innerHTML = `<span style="font-size:10px; color:#94a3b8;">所有駅なし</span>`;
    }

    document.getElementById("my-trade-cash").value = "0";
    document.getElementById("target-trade-cash").value = "0";
    updateTradeDialogue();
  }

  function updateTradeDialogue() {
    const me = players[currentTurn];
    const targetId = parseInt(document.getElementById("trade-target-select").value, 10);
    const target = players.find(pl => pl.id === targetId);
    if (!target) return;

    const myPropIds = Array.from(document.querySelectorAll(".my-prop-check:checked")).map(cb => parseInt(cb.value, 10));
    const targetPropIds = Array.from(document.querySelectorAll(".target-prop-check:checked")).map(cb => parseInt(cb.value, 10));

    const myCash = parseInt(document.getElementById("my-trade-cash").value, 10) || 0;
    const targetCash = parseInt(document.getElementById("target-trade-cash").value, 10) || 0;

    const myPropNames = myPropIds.map(id => `【${SQUARES[id].name}】`).join(" と ");
    const targetPropNames = targetPropIds.map(id => `【${SQUARES[id].name}】`).join(" と ");

    let giveText = myPropNames;
    if (myCash > 0) giveText += (giveText ? ` および資金 $${myCash}` : `資金 $${myCash}`);

    let wantText = targetPropNames;
    if (targetCash > 0) wantText += (wantText ? ` および資金 $${targetCash}` : `資金 $${targetCash}`);

    const preview = document.getElementById("trade-dialogue-preview");
    if (!giveText && !wantText) {
      preview.innerText = "提供または要求する物件・資金を選択してください。";
    } else {
      preview.innerText = `「${target.name}様、私どもの${giveText || '条件'}で、貴殿の${wantText || '条件'}を交換していただけないでしょうか？」`;
    }
  }

  function submitTradeProposal() {
    const me = players[currentTurn];
    const targetId = parseInt(document.getElementById("trade-target-select").value, 10);
    const target = players.find(pl => pl.id === targetId);
    if (!target) return;

    const myPropIds = Array.from(document.querySelectorAll(".my-prop-check:checked")).map(cb => parseInt(cb.value, 10));
    const targetPropIds = Array.from(document.querySelectorAll(".target-prop-check:checked")).map(cb => parseInt(cb.value, 10));
    const myCash = parseInt(document.getElementById("my-trade-cash").value, 10) || 0;
    const targetCash = parseInt(document.getElementById("target-trade-cash").value, 10) || 0;

    if (myCash > me.money) { alert("提供資金が所持金を超えています。"); return; }
    if (targetCash > target.money) { alert("要求資金が相手の所持金を超えています。"); return; }
    if (myPropIds.length === 0 && myCash === 0 && targetPropIds.length === 0 && targetCash === 0) {
      alert("交換内容を選択してください。"); return;
    }

    closeTradeModal();

    if (target.isCPU) {
      evaluateCpuTrade(me, target, myPropIds, targetPropIds, myCash, targetCash);
    } else {
      const accept = confirm(`${target.name}様への提案:\n\n${document.getElementById("trade-dialogue-preview").innerText}\n\nこの提案を受諾しますか？`);
      if (accept) {
        executeTrade(me, target, myPropIds, targetPropIds, myCash, targetCash);
        showEventToast(`トレード成立！`);
        triggerConfetti();
      } else {
        showEventToast(`提案は辞退されました`);
      }
    }
  }

  function evaluateCpuTrade(proposer, cpu, givePropIds, wantPropIds, giveCash, wantCash) {
    showEventToast(`[CPU] 提案を査定中...`);

    setTimeout(() => {
      const iq = aiLevel / 100;
      let giveValue = giveCash;
      givePropIds.forEach(id => {
        const sq = SQUARES[id];
        giveValue += sq.price;
        if (willCompleteMonopoly(cpu.id, sq.group, givePropIds)) giveValue += sq.price * 2.5;
      });

      let wantValue = wantCash;
      let assistOpponentMonopoly = false;
      wantPropIds.forEach(id => {
        const sq = SQUARES[id];
        wantValue += sq.price;
        if (willCompleteMonopoly(proposer.id, sq.group, wantPropIds)) {
          assistOpponentMonopoly = true;
          wantValue += sq.price * (2.0 + iq * 3.0);
        }
      });

      let accepted = false;
      if (iq >= 0.8) {
        if (!assistOpponentMonopoly && giveValue >= wantValue * 1.1) accepted = true;
      } else if (iq >= 0.4) {
        if (giveValue >= wantValue * 0.95) accepted = true;
      } else {
        if (giveValue >= wantValue * 0.7 || Math.random() < 0.4) accepted = true;
      }

      if (accepted) {
        executeTrade(proposer, cpu, givePropIds, wantPropIds, giveCash, wantCash);
        showEventToast(`[交渉成立] ${cpu.name} が受諾！`);
        triggerConfetti();
      } else {
        showEventToast(`[交渉決裂] ${cpu.name}「お断りします」`);
      }
      updateUI();
    }, 850 / gameSpeed);
  }

  function willCompleteMonopoly(targetPlayerId, groupKey, acquiredPropIds) {
    const groupSquares = COLOR_GROUPS[groupKey].map(id => SQUARES[id]);
    const remaining = groupSquares.filter(s => s.owner !== targetPlayerId && !acquiredPropIds.includes(s.id));
    return (remaining.length === 0);
  }

  function executeTrade(p1, p2, p1GiveProps, p2GiveProps, p1Cash, p2Cash) {
    p1.money -= p1Cash;
    p2.money += p1Cash;
    p2.money -= p2Cash;
    p1.money += p2Cash;

    p1GiveProps.forEach(id => {
      const sq = SQUARES[id];
      sq.owner = p2.id;
      p1.props = p1.props.filter(pr => pr.id !== id);
      p2.props.push(sq);
      updateTileOwnershipVisual(id, p2.color);
    });

    p2GiveProps.forEach(id => {
      const sq = SQUARES[id];
      sq.owner = p1.id;
      p2.props = p2.props.filter(pr => pr.id !== id);
      p1.props.push(sq);
      updateTileOwnershipVisual(id, p1.color);
    });

    renderMonopolyTracker();
    updateUI();
  }

  /* カード共通アクション */
  function drawCard(p, deck, deckName, isDouble) {
    const card = deck.shift();
    deck.push(card);

    showEventToast(`【${deckName}】${card.text}`);

    setTimeout(() => {
      card.action(p);
      updateUI();
      if (!checkBankruptcy(p, null)) {
        finishTurn(isDouble);
      }
    }, 700 / gameSpeed);
  }

  function advanceToNext(p, idList, multiplier) {
    let nextId = idList.find(id => id > p.pos);
    if (!nextId) nextId = idList[0];
    const steps = (nextId >= p.pos) ? (nextId - p.pos) : (40 - p.pos + nextId);
    startMove(p, steps, false);
  }

  function advanceToNextUtility(p) {
    advanceToNext(p, [12, 28], 1);
  }

  function moveToSquare(p, targetId) {
    const steps = (targetId >= p.pos) ? (targetId - p.pos) : (40 - p.pos + targetId);
    startMove(p, steps, false);
  }

  function payRepairs(p, houseRate, hotelRate) {
    let cost = 0;
    p.props.forEach(sq => {
      if (sq.houses === 5) cost += hotelRate;
      else if (sq.houses > 0) cost += sq.houses * houseRate;
    });
    p.money -= cost;
    spawnMoneyFloat(-cost);
  }

  function collectFromAll(p, amount) {
    players.forEach(other => {
      if (other.id !== p.id && !other.bankrupt) {
        other.money -= amount;
        p.money += amount;
      }
    });
    spawnMoneyFloat(amount * (players.filter(pl=>!pl.bankrupt).length - 1));
  }

  function sendToJail(p) {
    p.pos = 10;
    p.inJail = true;
    p.jailTurns = 0;
    positionToken(p, 10);
    highlightTile(10);
    showEventToast(`${p.name} 留置線収監`);
    updateUI();
  }

  function payJailFine() {
    const p = players[currentTurn];
    if (p.inJail && p.money >= 50) {
      p.money -= 50;
      p.inJail = false;
      p.jailTurns = 0;
      spawnMoneyFloat(-50);
      showEventToast(`保釈金 $50 出所完了`);
      updateUI();
    }
  }

  function useJailPass() {
    const p = players[currentTurn];
    if (p.inJail && p.jailPasses > 0) {
      p.jailPasses--;
      p.inJail = false;
      p.jailTurns = 0;
      showEventToast(`出場証を使用して出所！`);
      updateUI();
    }
  }

  function checkBankruptcy(p, creditor) {
    if (p.money < 0) {
      tryLiquidateAssets(p);

      if (p.money < 0) {
        p.bankrupt = true;
        showEventToast(`[破産] ${p.name} が脱落！`);

        if (creditor) {
          p.props.forEach(sq => {
            sq.owner = creditor.id;
            creditor.props.push(sq);
            updateTileOwnershipVisual(sq.id, creditor.color);
          });
          if (p.money > 0) creditor.money += p.money;
          creditor.jailPasses += p.jailPasses;
          showEventToast(`全遺産を ${creditor.name} へ譲渡`);
        } else {
          p.props.forEach(sq => {
            sq.owner = null;
            sq.houses = 0;
            sq.mortgaged = false;
            updateTileOwnershipVisual(sq.id, null);
          });
        }

        p.props = [];
        p.mesh.visible = false;
        renderMonopolyTracker();
        updateUI();

        const activePlayers = players.filter(pl => !pl.bankrupt);
        if (activePlayers.length === 1) {
          isGameOver = true;
          triggerConfetti();
          alert(`ゲーム終了！ 勝者は ${activePlayers[0].name} です！`);
          return true;
        }
        return true;
      }
    }
    return false;
  }

  function tryLiquidateAssets(p) {
    p.props.forEach(sq => {
      while (sq.houses > 0 && p.money < 0) {
        sq.houses--;
        p.money += Math.floor(sq.houseCost / 2);
        spawnMoneyFloat(Math.floor(sq.houseCost / 2));
      }
    });
    p.props.forEach(sq => {
      if (!sq.mortgaged && p.money < 0) {
        sq.mortgaged = true;
        p.money += Math.floor(sq.price / 2);
        spawnMoneyFloat(Math.floor(sq.price / 2));
      }
    });
  }

  function spawn3DBuilding(sqId, color, houses) {
    const pos = getSquarePos3D(sqId);
    const dir = new THREE.Vector3(0, 0, 0).sub(pos).normalize();
    const bPos = pos.clone().add(dir.multiplyScalar(0.65));

    const group = new THREE.Group();
    if (houses === 5) {
      const hotel = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.45, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.2, metalness: 0.1 })
      );
      hotel.position.y = 0.22;
      hotel.castShadow = true;
      group.add(hotel);
    } else {
      const house = new THREE.Mesh(
        new THREE.BoxGeometry(0.22, 0.22, 0.22),
        new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.2 })
      );
      house.position.y = 0.11;
      house.castShadow = true;
      group.add(house);
    }

    group.position.set(bPos.x, 0.05, bPos.z);
    housesGroup.add(group);
  }

  function finishTurn(isDouble) {
    if (isDouble && !isGameOver && !players[currentTurn].inJail) {
      updateUI();
      if (players[currentTurn].isCPU) {
        triggerCpuTurn();
      }
    } else {
      doublesCount = 0;
      nextTurn();
    }
  }

  function nextTurn() {
    do {
      currentTurn = (currentTurn + 1) % players.length;
    } while (players[currentTurn].bankrupt);

    updateUI();
    if (!isGameOver && players[currentTurn].isCPU) {
      triggerCpuTurn();
    }
  }

  function triggerCpuTurn() {
    const p = players[currentTurn];
    const rollBtn = document.getElementById("roll-btn");
    rollBtn.disabled = true;
    rollBtn.innerText = "CPU 思考中...";
    updateUI(); // CPU手番開始時にボタンを完全にロック

    if (aiLevel > 40) {
      p.props.forEach(sq => {
        if (sq.type === "prop" && checkMonopoly(p.id, sq.group) && canBuildHouse(sq)) {
          if (p.money >= sq.houseCost + 250) {
            p.money -= sq.houseCost;
            sq.houses++;
            spawn3DBuilding(sq.id, p.color, sq.houses);
            showEventToast(`[CPU] ${sq.name} に増築！`);
          }
        }
      });
    }

    setTimeout(() => {
      if (isGameOver || !p.isCPU) return;

      if (p.inJail) {
        if (p.jailPasses > 0) {
          p.jailPasses--;
          p.inJail = false;
          p.jailTurns = 0;
          showEventToast(`[CPU] 出場証で出所`);
        } else if (p.money >= 300) {
          p.money -= 50;
          p.inJail = false;
          p.jailTurns = 0;
          spawnMoneyFloat(-50);
          showEventToast(`[CPU] 保釈金出所`);
        }
      }

      rollDice();
    }, 850 / gameSpeed);
  }

  /* ============================================================
     UI更新 & CPU番でのボタン完全ロック
     ============================================================ */
  function renderPlayerCardsUI() {
    const dock = document.getElementById("players-floating-dock");
    dock.innerHTML = "";

    players.forEach((p) => {
      const card = document.createElement("div");
      card.id = `card-p${p.id}`;
      card.className = "player-card";
      card.innerHTML = `
        <div class="p-head">
          <div class="p-name-badge">
            <span class="color-dot" style="background:${p.color}"></span>
            <span>${p.name}</span>
            <span class="p-tag">${p.isCPU ? 'CPU' : 'YOU'}</span>
          </div>
          <div>
            <span id="jail-tag-p${p.id}" class="p-status-jail" style="display:none;">留置</span>
            <span id="pass-tag-p${p.id}" class="p-status-pass" style="display:none;">証</span>
          </div>
        </div>
        <div class="p-money" id="money-p${p.id}">$${p.money}</div>
        <div class="p-props-box">
          所有駅 (<span id="count-p${p.id}">0</span>):
          <div class="p-props-list" id="props-p${p.id}"></div>
        </div>
      `;
      dock.appendChild(card);
    });
  }

  function updateUI() {
    players.forEach(p => {
      const mEl = document.getElementById(`money-p${p.id}`);
      const cEl = document.getElementById(`count-p${p.id}`);
      const prEl = document.getElementById(`props-p${p.id}`);
      const jEl = document.getElementById(`jail-tag-p${p.id}`);
      const passEl = document.getElementById(`pass-tag-p${p.id}`);
      const card = document.getElementById(`card-p${p.id}`);

      if (mEl) mEl.innerText = `$${p.money}`;
      if (cEl) cEl.innerText = p.props.length;
      if (jEl) jEl.style.display = p.inJail ? "inline" : "none";
      if (passEl) passEl.style.display = p.jailPasses > 0 ? "inline" : "none";
      if (card) {
        card.classList.toggle("active-turn", currentTurn === (p.id - 1) && !isGameOver);
        card.classList.toggle("bankrupted", p.bankrupt);
      }

      if (prEl) {
        prEl.innerHTML = p.props.map(pr => {
          const mClass = pr.mortgaged ? 'mortgaged' : '';
          const hText = pr.houses === 5 ? '★' : (pr.houses > 0 ? `+${pr.houses}` : '');
          return `<span class="prop-chip ${mClass}" style="background:${pr.color || '#475569'};" onclick="showStationDetails(${pr.id})">${pr.name}${hText}</span>`;
        }).join("");
      }
    });

    const activeP = players[currentTurn];
    const indicatorName = document.getElementById("turn-name");
    const indicatorDot = document.getElementById("turn-dot");
    if (indicatorName && activeP) {
      indicatorName.innerText = `${activeP.name} の手番`;
      indicatorDot.style.background = activeP.color;
    }

    const rollBtn = document.getElementById("roll-btn");
    const jailPayBtn = document.getElementById("jail-pay-btn");
    const jailPassBtn = document.getElementById("jail-pass-btn");
    const manageBtn = document.getElementById("manage-btn");
    const tradeBtn = document.getElementById("trade-btn");

    // 人間の手番で、かつ移動中・ゲーム終了でないときのみ操作可能！
    const isHumanTurn = (activeP && !activeP.isCPU && !activeP.bankrupt && !isMoving && !isGameOver);

    tradeBtn.disabled = !isHumanTurn;
    manageBtn.disabled = !isHumanTurn;

    if (activeP.isCPU) {
      rollBtn.disabled = true;
      rollBtn.innerText = "CPU 手番中...";
      jailPayBtn.style.display = "none";
      jailPassBtn.style.display = "none";
    } else {
      rollBtn.disabled = !isHumanTurn;
      rollBtn.innerText = "ダイスを振る (2D6)";
      jailPayBtn.style.display = (activeP.inJail && activeP.money >= 50 && !isMoving) ? "block" : "none";
      jailPassBtn.style.display = (activeP.inJail && activeP.jailPasses > 0 && !isMoving) ? "block" : "none";
    }
  }

  function showModal(title, barColor, descHtml, confirmText, cancelText, callback) {
    const modal = document.getElementById("game-modal");
    document.getElementById("modal-bar").style.backgroundColor = barColor || "#ffd400";
    document.getElementById("modal-title").innerText = title;
    document.getElementById("modal-desc").innerHTML = descHtml;
    document.getElementById("modal-btn-confirm").innerText = confirmText;

    const cancelBtn = document.getElementById("modal-btn-cancel");
    if (cancelText) {
      cancelBtn.style.display = "block";
      cancelBtn.innerText = cancelText;
    } else {
      cancelBtn.style.display = "none";
    }

    modalActionCallback = callback;
    modal.classList.add("active");
  }

  function handleModalAction(accepted) {
    document.getElementById("game-modal").classList.remove("active");
    if (modalActionCallback) {
      modalActionCallback(accepted);
      modalActionCallback = null;
    }
  }

  function setCameraView(type) {
    if (!camera) return;
    const isPortrait = window.innerWidth <= 768;
    const dist = isPortrait ? 1.25 : 1.0;

    if (type === 'default') {
      camera.position.set(0, 11 * dist, 11 * dist);
      controls.target.set(0, 0, 0);
    } else if (type === 'top') {
      camera.position.set(0, 18 * dist, 0.01);
      controls.target.set(0, 0, 0);
    }
    controls.update();
  }

  function onWindowResize() {
    const container = document.getElementById("webgl-container");
    if (!container || !renderer || !camera) return;
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    const isPortrait = window.innerWidth <= 768;
    camera.fov = isPortrait ? 52 : 36;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);

    const canvas = document.getElementById("confetti-canvas");
    if (canvas) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    if (controls) controls.update();
    if (renderer && scene && camera) renderer.render(scene, camera);
    updateConfetti();
  }

  window.onload = initHomeScreen;
</script>
